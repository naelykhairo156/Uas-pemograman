<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>AuraFit | Personalized Beauty & Health</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

  <!-- DASHBOARD -->
  <section class="step active">
    <h1>🌸 AuraFit</h1>
    <p class="tagline">Personalized beauty & style, just for you</p>
    <button onclick="nextStep()">Mulai</button>
  </section>

  <!-- SKINTONE -->
  <section class="step">
    <h2>Skintone Scanner</h2>
    <p>Simulasi pemindaian kamera...</p>
    <button onclick="scanSkintone()">Scan Sekarang</button>
    <div id="skintoneResult"></div>
    <div class="nav">
      <button onclick="prevStep()">Kembali</button>
      <button onclick="nextStep()">Selanjutnya</button>
    </div>
  </section>

  <!-- FACE FRAMING -->
  <section class="step">
    <h2>Face Framing Analysis</h2>
    <p>Memindai bentuk wajah...</p>
    <button onclick="scanFace()">Scan Wajah</button>
    <div id="faceResult"></div>
    <div class="image-row">
      <img id="hijabImg">
      <img id="hairImg">
    </div>
    <div class="nav">
      <button onclick="prevStep()">Kembali</button>
      <button onclick="nextStep()">Selanjutnya</button>
    </div>
  </section>

  <!-- BMI -->
  <section class="step">
    <h2>BMI & Health</h2>
    <input type="number" id="bb" placeholder="Berat Badan (kg)">
    <input type="number" id="tb" placeholder="Tinggi Badan (cm)">
    <button onclick="hitungBMI()">Hitung BMI</button>
    <div id="bmiResult"></div>
    <div id="mealTable"></div>
    <div class="nav">
      <button onclick="prevStep()">Kembali</button>
      <button onclick="nextStep()">Selanjutnya</button>
    </div>
  </section>

  <!-- OOTD -->
  <section class="step">
    <h2>OOTD Advisor</h2>
    <p>ini rekomendasi outfit yang cocok untuk mu 💕</p>
    <img id="ootdImg">
    <div class="nav">
      <button onclick="prevStep()">Kembali</button>
      <button onclick="nextStep()">Lihat Jurnal</button>
    </div>
  </section>

  <!-- JURNAL -->
  <section class="step journal">
    <h2>🌷 AuraFit Journal</h2>
    <p id="date"></p>

    <div class="journal-box">
      <p><strong>Skintone:</strong> <span id="jSkintone"></span></p>
      <p><strong>Bentuk Wajah:</strong> <span id="jFace"></span></p>

      <div class="image-row">
        <img id="jHijab">
        <img id="jHair">
      </div>

      <p><strong>BMI:</strong> <span id="jBMI"></span></p>
      <div id="jMeal"></div>

      <img id="jOOTD">
    </div>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
