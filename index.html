<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>AuraFit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- DASHBOARD -->
  <section id="dashboard" class="section active center">
    <h1>AuraFit</h1>
    <p>Personalized beauty & style, just for you</p>
    <button onclick="nextSection('skintone')">Mulai</button>
  </section>

  <!-- SKINTONE -->
  <section id="skintone" class="section">
    <h2>Skintone Scanner</h2>
    <video id="videoSkin" autoplay></video>
    <canvas id="canvasSkin"></canvas>
    <p id="skinError" class="error"></p>
    <button onclick="startCamera('skin')">Aktifkan Kamera</button>
    <button onclick="captureSkin()">Ambil Foto</button>
    <div id="skinResult"></div>
    <button onclick="nextSection('face')">Selanjutnya</button>
  </section>

  <!-- FACE SHAPE -->
  <section id="face" class="section">
    <h2>Face Framing</h2>
    <video id="videoFace" autoplay></video>
    <canvas id="canvasFace"></canvas>
    <button onclick="startCamera('face')">Aktifkan Kamera</button>
    <button onclick="detectFace()">Scan Wajah</button>
    <div class="img-row">
      <img id="imgHijab">
      <img id="imgRambut">
    </div>
    <p id="faceText"></p>
    <button onclick="nextSection('bmi')">Selanjutnya</button>
  </section>

  <!-- BMI -->
  <section id="bmi" class="section">
    <h2>BMI & Health</h2>
    <input type="number" id="bb" placeholder="Berat (kg)">
    <input type="number" id="tb" placeholder="Tinggi (cm)">
    <button onclick="hitungBMI()">Hitung</button>
    <p id="bmiResult"></p>
    <div id="mealTable"></div>
    <button onclick="nextSection('ootd')">Selanjutnya</button>
  </section>

  <!-- OOTD -->
  <section id="ootd" class="section">
    <h2>Rekomendasi OOTD Sesuai BMI Kamu</h2>
    <p>ini rekomendasi outfit yang cocok untuk mu 💕</p>
    <img id="imgOOTD">
    <button onclick="nextSection('journal')">Lihat Jurnal</button>
  </section>

  <!-- JOURNAL -->
  <section id="journal" class="section">
    <h2>✨ AuraFit Journal ✨</h2>
    <p id="dateNow"></p>
    <div id="journalContent"></div>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
