<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>AuraFit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Journal Font -->
  <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">

  <!-- PDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- DASHBOARD -->
<section id="dashboard" class="page show dashboard">
  <div class="flower pink"></div>
  <div class="flower blue"></div>

  <div class="dash-content">
    <h1>🌸 AuraFit</h1>
    <p class="subtitle">
      Tunjukkan sinarmu hari ini dengan gaya yang paling tepat untuk dirimu S(✿◡‿◡)
    </p>
    <button class="btn-start" onclick="goTo('skintone')">Mulai</button>
  </div>
</section>

<!-- SKINTONE -->
<section id="skintone" class="page center">
  <h2>Skintone Scanner</h2>

  <video id="videoSkin" autoplay></video>
  <canvas id="canvasSkin"></canvas>
  <p id="skinError" class="error"></p>

  <button onclick="startCamera('skin')">Aktifkan Kamera</button>
  <button onclick="scanSkintone()">Ambil Foto</button>

  <div id="skinResult"></div>

  <div class="nav">
    <button onclick="goTo('dashboard')">Kembali</button>
    <button onclick="goTo('face')">Selanjutnya</button>
  </div>
</section>

<!-- FACE -->
<section id="face" class="page center">
  <h2>Face Framing</h2>

  <video id="videoFace" autoplay></video>
  <canvas id="canvasFace"></canvas>

  <button onclick="startCamera('face')">Aktifkan Kamera</button>
  <button onclick="scanFace()">Scan Wajah</button>

  <p id="faceText"></p>

  <h4>Ini style hijab yang cocok untuk mu</h4>
  <img id="imgHijab">

  <h4>Ini style rambut yang cocok untuk mu</h4>
  <img id="imgRambut">

  <div class="nav">
    <button onclick="goTo('skintone')">Kembali</button>
    <button onclick="goTo('bmi')">Selanjutnya</button>
  </div>
</section>

<!-- BMI -->
<section id="bmi" class="page center">
  <h2>BMI & Health</h2>

  <input id="bb" type="number" placeholder="Berat (kg)">
  <input id="tb" type="number" placeholder="Tinggi (cm)">
  <button onclick="hitungBMI()">Hitung</button>

  <p id="bmiResult"></p>
  <p id="bmiTips"></p>

  <div id="mealTable"></div>

  <div class="nav">
    <button onclick="goTo('face')">Kembali</button>
    <button onclick="goTo('ootd')">Selanjutnya</button>
  </div>
</section>

<!-- OOTD -->
<section id="ootd" class="page center">
  <h2>Rekomendasi OOTD Sesuai BMI Kamu</h2>
  <img id="imgOOTD" class="ootd">
  <div class="nav">
    <button onclick="goTo('bmi')">Kembali</button>
    <button onclick="goTo('journal')">Selanjutnya</button>
  </div>
</section>

<!-- JOURNAL -->
<section id="journal" class="page journal center">
  <h2>✨ AuraFit Journal ✨</h2>
  <p id="dateNow"></p>

  <div id="journalContent"></div>

  <button onclick="savePDF()">Cetak / Simpan Jurnal</button>

  <div class="nav">
    <button onclick="goTo('ootd')">Kembali</button>
    <button onclick="location.reload()">Muat Ulangggg👍</button>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
