<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>AuraFit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- DASHBOARD -->
  <section id="dashboard">
    <h1>🌸 AuraFit</h1>
    <p>Personalized beauty & health advisor</p>
    <button onclick="goTo('skintone')">Mulai</button>
  </section>

  <!-- SKINTONE -->
  <section id="skintone">
    <h2>Skintone Scanner</h2>

    <video id="skinVideo" autoplay playsinline></video>
    <canvas id="skinCanvas"></canvas>

    <button onclick="takeSkinPhoto()">Ambil Foto</button>
    <p id="skinResult"></p>
    <p class="error" id="skinError"></p>

    <div class="nav">
      <button onclick="goTo('dashboard')">Kembali</button>
      <button onclick="goTo('face')">Selanjutnya</button>
    </div>
  </section>

  <!-- FACE -->
  <section id="face">
    <h2>Face Framing</h2>

    <video id="faceVideo" autoplay playsinline></video>
    <canvas id="faceCanvas"></canvas>

    <button onclick="takeFacePhoto()">Ambil Foto</button>
    <p id="faceResult"></p>
    <p class="error" id="faceError"></p>

    <div class="image-row">
      <img id="hijabImg">
      <img id="hairImg">
    </div>

    <div class="nav">
      <button onclick="goTo('skintone')">Kembali</button>
      <button onclick="goTo('bmi')">Selanjutnya</button>
    </div>
  </section>

  <!-- BMI -->
  <section id="bmi">
    <h2>BMI & Health</h2>

    <input id="bb" type="number" placeholder="Berat Badan (kg)">
    <input id="tb" type="number" placeholder="Tinggi Badan (cm)">
    <button onclick="hitungBMI()">Hitung BMI</button>

    <p id="bmiResult"></p>

    <div class="nav">
      <button onclick="goTo('face')">Kembali</button>
      <button onclick="goTo('ootd')">Selanjutnya</button>
    </div>
  </section>

  <!-- OOTD -->
  <section id="ootd">
    <h2>OOTD Advisor 👩</h2>
    <p>ini rekomendasi outfit yang cocok untuk mu 💕</p>
    <img id="ootdImg">

    <div class="nav">
      <button onclick="goTo('bmi')">Kembali</button>
      <button onclick="goTo('journal')">Jurnal</button>
    </div>
  </section>

  <!-- JOURNAL -->
  <section id="journal">
    <h2>🌷 AuraFit Journal</h2>
    <p id="date"></p>

    <p><strong>Skintone:</strong> <span id="jSkin"></span></p>
    <p><strong>Bentuk Wajah:</strong> <span id="jFace"></span></p>

    <img id="jHijab">
    <img id="jHair">

    <p><strong>BMI:</strong> <span id="jBMI"></span></p>
    <img id="jOOTD">
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
