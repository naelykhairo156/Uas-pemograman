<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>AuraFit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Journal Font -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- DASHBOARD -->
<section id="dashboard" class="page show center-page">
  <div class="dashboard-box">
    <h1>AuraFit</h1>
    <p>Personalized beauty & health advisor</p>
    <button onclick="goTo('skintone')">Mulai</button>
  </div>
</section>

<!-- SKINTONE -->
<section id="skintone" class="page">
  <h2>Skintone Analysis</h2>

  <video id="videoSkin" autoplay></video>
  <canvas id="canvasSkin"></canvas>
  <p id="skinError" class="error"></p>

  <button onclick="startCamera('skin')">Aktifkan Kamera</button>
  <button onclick="scanSkintone()">Ambil Foto</button>

  <div id="skinResult"></div>

  <button onclick="goTo('face')">Selanjutnya</button>
</section>

<!-- FACE -->
<section id="face" class="page">
  <h2>Face Framing</h2>

  <video id="videoFace" autoplay></video>
  <canvas id="canvasFace"></canvas>

  <button onclick="startCamera('face')">Aktifkan Kamera</button>
  <button onclick="scanFace()">Scan Wajah</button>

  <div class="center-col">
    <h4>Ini style hijab yang cocok untuk mu</h4>
    <img id="imgHijab">

    <h4>Ini style rambut yang cocok untuk mu</h4>
    <img id="imgRambut">
  </div>

  <button onclick="goTo('bmi')">Selanjutnya</button>
</section>

<!-- BMI -->
<section id="bmi" class="page">
  <h2>BMI & Health</h2>

  <div class="bmi-input">
    <input type="number" id="bb" placeholder="Berat (kg)">
    <input type="number" id="tb" placeholder="Tinggi (cm)">
  </div>

  <button onclick="hitungBMI()">Hitung</button>

  <p id="bmiResult"></p>
  <p id="bmiTips"></p>

  <div id="mealTable"></div>

  <button onclick="goTo('ootd')">Selanjutnya</button>
</section>

<!-- OOTD -->
<section id="ootd" class="page">
  <h2>Rekomendasi OOTD Sesuai BMI Kamu</h2>
  <img id="imgOOTD" class="ootd-img">
  <button onclick="goTo('journal')">Lihat Jurnal</button>
</section>

<!-- JOURNAL -->
<section id="journal" class="page journal">
  <h2>✨ AuraFit Journal ✨</h2>
  <p id="dateNow"></p>

  <div id="journalContent"></div>
</section>

<script src="script.js"></script>
</body>
</html>
